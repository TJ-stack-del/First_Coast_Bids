name: CI

# Runs on every push to main and every PR targeting main — catches build
# and type errors before they ever reach production, closing the gap
# that let the ambiguous-FK bug and other issues slip through silently.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check + build
        run: npm run build
        env:
          # Next.js requires these variables while prerendering, but this
          # job does not call Supabase, Anthropic, or Resend. Placeholder
          # values keep real development and production secrets out of CI.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
          NEXT_PUBLIC_SUPABASE_JWKS_URL: https://example.supabase.co/auth/v1/.well-known/jwks.json
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
          ANTHROPIC_API_KEY: ci-placeholder-anthropic-key
          RESEND_API_KEY: ci-placeholder-resend-key
          CRON_SECRET: ci-placeholder-cron-secret
          ADMIN_DIGEST_EMAIL: admin@example.com

      - name: Run unit tests
        run: npm test

  rfp-extractor:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: rfp-extractor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.17'
          enable-cache: true
          cache-dependency-glob: rfp-extractor/uv.lock

      - name: Install OCR engine
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install extractor
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      - name: Run extractor tests
        run: uv run --frozen pytest

      - name: Build extractor package
        run: uv build
